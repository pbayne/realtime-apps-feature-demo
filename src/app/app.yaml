# --ws-max-size: one WebSocket message at most 1 MiB (SPEC 10). Larger frames are refused by the server.
command: ["sh", "-c", "uvicorn main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000} --ws-max-size 1048576"]

env:
  - name: MODE
    value: databricks
  # Data path (docs/ARCHITECTURE.md). direct: no Kafka, history via Zerobus. kafka: Kafka + RTM, history via jobs.
  - name: BACKBONE
    valueFrom: backbone
  # Live state (both backbones): Lakebase.
  - name: LAKEBASE_HOST
    valueFrom: lakebase-host
  - name: LAKEBASE_DB
    valueFrom: lakebase-db
  - name: LAKEBASE_USER
    valueFrom: lakebase-user
  - name: LAKEBASE_PASSWORD
    valueFrom: lakebase-password
  # History, direct backbone: Zerobus Ingest -> UC Delta (src/app/history/zerobus.py, SPEC 3.7).
  - name: ZEROBUS_ENDPOINT
    valueFrom: zerobus-endpoint
  - name: ZEROBUS_CLIENT_ID
    valueFrom: zerobus-client-id
  - name: ZEROBUS_CLIENT_SECRET
    valueFrom: zerobus-client-secret
  - name: HISTORY_CATALOG
    valueFrom: history-catalog
  - name: HISTORY_SCHEMA
    valueFrom: history-schema
  # Kafka, kafka backbone only: KAFKA_SECURITY uses the notebook mode names (SASL_SSL_PLAIN for Confluent,
  # SASL_SSL_SCRAM_SHA_256 for Redpanda Cloud). The username/password are the app's producer identity.
  - name: KAFKA_BOOTSTRAP_SERVERS
    valueFrom: kafka-bootstrap
  - name: KAFKA_SECURITY
    valueFrom: kafka-security
  - name: KAFKA_USERNAME
    valueFrom: kafka-api-key
  - name: KAFKA_PASSWORD
    valueFrom: kafka-api-secret
  # Endpoint names come from the app's serving-endpoint resources.
  - name: STT_ENDPOINT
    valueFrom: parakeet-stt
  # Voice mode (SPEC 9): Kokoro TTS and the voice chat model. TTS_VOICE is the default voice.
  - name: TTS_ENDPOINT
    valueFrom: kokoro-tts
  - name: VOICE_MODEL
    valueFrom: voice-llm
  - name: TTS_VOICE
    value: af_heart
  - name: FAST_MODEL
    valueFrom: fast-llm
  - name: SMART_MODEL
    valueFrom: smart-llm
  - name: EMBED_MODEL
    valueFrom: embedding
  # Actions (SPEC 12): SMTP relay. Unset ("unset" placeholder) = outbox mode, nothing is sent.
  - name: SMTP_HOST
    valueFrom: smtp-host
  - name: SMTP_PORT
    valueFrom: smtp-port
  - name: SMTP_USERNAME
    valueFrom: smtp-username
  - name: SMTP_PASSWORD
    valueFrom: smtp-password
  - name: SMTP_FROM
    valueFrom: smtp-from
