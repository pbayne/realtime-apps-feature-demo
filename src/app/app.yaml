# --ws-max-size: one WebSocket message at most 1 MiB (SPEC 10). Larger frames are refused by the server.
command: ["sh", "-c", "uvicorn main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000} --ws-max-size 1048576"]

env:
  - name: MODE
    value: databricks
  # Deploy-time settings arrive as one JSON secret per group (Apps allow at most 20 resources); config.py expands
  # them into the individual env names (BACKBONE, LAKEBASE_*, ZEROBUS_*, HISTORY_*, KAFKA_*). See BUNDLED_ENV.
  - name: APP_CONFIG
    valueFrom: app-config
  - name: LAKEBASE_CONFIG
    valueFrom: lakebase-config
  - name: ZEROBUS_CONFIG
    valueFrom: zerobus-config
  - name: KAFKA_CONFIG
    valueFrom: kafka-config
  # Endpoint names come from the app's serving-endpoint resources.
  - name: STT_ENDPOINT
    valueFrom: parakeet-stt
  # Voice mode (SPEC 9): Kokoro TTS and the voice chat model. TTS_VOICE is the default voice.
  - name: TTS_ENDPOINT
    valueFrom: kokoro-tts
  - name: VOICE_MODEL
    valueFrom: voice-llm
  - name: TTS_VOICE
    value: af_heart
  - name: FAST_MODEL
    valueFrom: fast-llm
  - name: SMART_MODEL
    valueFrom: smart-llm
  - name: EMBED_MODEL
    valueFrom: embedding
  # Admin insights (SPEC 13): the SQL warehouse the insights page queries. Unset means the page shows its empty state.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
