# Databricks App (source: src/app). The app runs as its own service principal, so every backend it touches
# is declared here as an app resource. Secret-scope keys are written by scripts/deploy.sh (values never live
# in git). Kafka keys are placeholders in the direct backbone: the app never reads them there.
#
# Env contract (src/app/app.yaml binds these names with valueFrom):
#   LAKEBASE_HOST, LAKEBASE_DB, LAKEBASE_USER, LAKEBASE_PASSWORD             <- secret resources (live state)
#   BACKBONE                                                                  <- backbone (direct | kafka)
#   ZEROBUS_ENDPOINT, ZEROBUS_CLIENT_ID, ZEROBUS_CLIENT_SECRET                <- zerobus-* (direct: history)
#   HISTORY_CATALOG, HISTORY_SCHEMA                                           <- history-* (direct: history)
#   KAFKA_BOOTSTRAP_SERVERS, KAFKA_SECURITY, KAFKA_USERNAME, KAFKA_PASSWORD  <- kafka-* (kafka backbone only)
#   STT_ENDPOINT, FAST_MODEL, SMART_MODEL, EMBED_MODEL                        <- serving endpoint resources
#   TTS_ENDPOINT, VOICE_MODEL                                                 <- serving endpoint resources (voice mode)
resources:
  apps:
    call_sidekick_app:
      name: ${var.app_name}
      description: Live call sidekick - WebSocket UI, sidekick agent, suggestion cards.
      source_code_path: ../src/app
      resources:
        - name: lakebase-host
          description: Lakebase Postgres host
          secret: {scope: "${var.secret_scope}", key: lakebase_host, permission: READ}

        - name: lakebase-db
          description: Lakebase database name
          secret: {scope: "${var.secret_scope}", key: lakebase_db, permission: READ}

        - name: lakebase-user
          description: Lakebase role
          secret: {scope: "${var.secret_scope}", key: lakebase_user, permission: READ}

        - name: lakebase-password
          description: Lakebase role password
          secret: {scope: "${var.secret_scope}", key: lakebase_password, permission: READ}

        - name: backbone
          description: Data path, direct (default) or kafka. Written by deploy.sh from the target.
          secret: {scope: "${var.secret_scope}", key: backbone, permission: READ}

        # Zerobus Ingest (direct backbone history). The service principal is the one init_history.py grants.
        - name: zerobus-endpoint
          description: Zerobus Ingest endpoint, <workspace-id>.zerobus.<region>.cloud.databricks.com
          secret: {scope: "${var.secret_scope}", key: zerobus_endpoint, permission: READ}

        - name: zerobus-client-id
          description: Zerobus service principal client id (application id)
          secret: {scope: "${var.secret_scope}", key: zerobus_client_id, permission: READ}

        - name: zerobus-client-secret
          description: Zerobus service principal OAuth client secret
          secret: {scope: "${var.secret_scope}", key: zerobus_client_secret, permission: READ}

        - name: history-catalog
          description: UC catalog for the history tables
          secret: {scope: "${var.secret_scope}", key: history_catalog, permission: READ}

        - name: history-schema
          description: UC schema for the history tables
          secret: {scope: "${var.secret_scope}", key: history_schema, permission: READ}

        # Kafka backbone only. Placeholders in the direct backbone (deploy.sh writes them if absent).
        - name: kafka-bootstrap
          description: Kafka bootstrap servers (Confluent endpoint or MSK IAM bootstrap string)
          secret: {scope: "${var.secret_scope}", key: kafka_bootstrap, permission: READ}

        - name: kafka-security
          description: Kafka auth mode (SASL_SSL_PLAIN | SASL_SSL_SCRAM_SHA_256 | SASL_SSL_SCRAM_SHA_512)
          secret: {scope: "${var.secret_scope}", key: kafka_security, permission: READ}

        # The app's own Kafka identity (write-only on the topics). The jobs use the separate
        # read-only kafka_api_key / kafka_api_secret. The app producer does not support
        # SASL_SSL_MSK_IAM.
        - name: kafka-api-key
          description: App Kafka SASL username / API key (producer)
          secret: {scope: "${var.secret_scope}", key: kafka_app_api_key, permission: READ}

        - name: kafka-api-secret
          description: App Kafka SASL password / API secret (producer)
          secret: {scope: "${var.secret_scope}", key: kafka_app_api_secret, permission: READ}

        - name: parakeet-stt
          description: GPU audio STT endpoint, Parakeet (created by register_parakeet.py; not route-optimized)
          serving_endpoint: {name: "${var.parakeet_endpoint}", permission: CAN_QUERY}

        - name: fast-llm
          description: Perception model (haiku)
          serving_endpoint: {name: "${var.fast_model}", permission: CAN_QUERY}

        - name: smart-llm
          description: Card composition model (sonnet)
          serving_endpoint: {name: "${var.smart_model}", permission: CAN_QUERY}

        - name: embedding
          description: Embeddings for KB retrieval
          serving_endpoint: {name: "${var.embed_model}", permission: CAN_QUERY}

        # Voice mode (SPEC 9). Kokoro (GPU, always on) and the voice chat model.
        - name: kokoro-tts
          description: Kokoro-82M text-to-speech (created by register_kokoro.py; voice mode)
          serving_endpoint: {name: "${var.kokoro_endpoint}", permission: CAN_QUERY}

        - name: voice-llm
          description: Voice mode model (haiku, thinking disabled)
          serving_endpoint: {name: "${var.voice_model}", permission: CAN_QUERY}
