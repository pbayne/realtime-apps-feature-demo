resources:
  postgres_projects:
    sidekick_lakebase:
      project_id: ${var.project_id}
      display_name: Call sidekick
      # The app and the setup job log in with a Postgres password role (scope secrets).
      enable_pg_native_login: true
      pg_version: 17
      # Always-on: the RTM sink and the app both need a warm endpoint. Suspending
      # it adds a cold-start to the first enrichment write.
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        no_suspension: true

  # Registers the Lakebase database in Unity Catalog (read-only). reconcile_history reads it as
  # <lakebase_catalog>.public.<table> on serverless compute. Idempotent: the bundle owns it.
  # Optional: register the Lakebase database in UC for reconcile_history source_mode=uc_catalog. It needs
  # CREATE CATALOG on the metastore (FEVM users do not have it), so the default source_mode is pg8000.
  # postgres_catalogs:
  #   sidekick_lakebase_catalog:
  #     catalog_id: ${var.lakebase_catalog}
  #     branch: projects/${var.project_id}/branches/${var.branch_name}
  #     postgres_database: ${var.database_name}
  #     lifecycle:
  #       prevent_destroy: true

  schemas:
    sidekick_schema:
      catalog_name: ${var.catalog}
      name: ${var.uc_schema}
      comment: Call sidekick - checkpoints, bronze and gold Delta tables, KB chunks, Parakeet model.

  volumes:
    sidekick_checkpoints:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.sidekick_schema.name}
      name: checkpoints
      volume_type: MANAGED

  # The secret scope and Kafka secrets are created out of band before the first deploy
  # (scripts/deploy.sh does this). They aren't DAB resources: the app secret bindings
  # require the keys to exist at deploy time. See README "Secrets".
