resources:
  clusters:
    # RTM cluster. Real-Time Mode (docs: structured-streaming/real-time/setup) needs:
    #   - classic compute, dedicated (SINGLE_USER) access mode
    #   - DBR 16.4+ for Kafka RTM; DBR 18.3+ for the native Lakebase postgresql sink
    #   - autoscaling OFF (fixed num_workers), Photon OFF, on-demand (no spot)
    #   - spark.databricks.streaming.realTimeMode.enabled=true
    # Sizing: 4 Kafka partitions -> 4 tasks. RTM requires total task slots >= tasks
    # across all stages. 2 x m5d.xlarge = 8 worker cores = 2 cores per partition.
    # Node type is a variable; AWS defaults. Azure/GCP: swap aws_attributes (README).
    rtm_cluster:
      cluster_name: call-copilot-rtm
      spark_version: ${var.dbr_version}
      data_security_mode: SINGLE_USER
      single_user_name: ${workspace.current_user.userName}
      runtime_engine: STANDARD              # Photon off
      node_type_id: ${var.rtm_node_type}
      driver_node_type_id: ${var.rtm_node_type}
      num_workers: ${var.rtm_num_workers}   # autoscale off
      autotermination_minutes: 120
      aws_attributes:
        availability: ON_DEMAND             # no spot
        first_on_demand: 1
      spark_conf:
        spark.databricks.streaming.realTimeMode.enabled: "true"
