# Jobs deployed by the direct backbone (default target `dev`). All run on SERVERLESS compute: no classic
# cluster, no RTM. The Kafka-only jobs (rtm_enrich, delta_history) and the RTM cluster are declared under
# targets.kafka in databricks.yml and need a classic workspace.
#
# Serverless spec: environment_version "6" (Standard v6, as in the reference audio notebooks). GPU jobs set
# compute.hardware_accelerator (task level, not in the environment spec).
resources:
  jobs:
    call_sidekick_setup:
      name: call-sidekick-setup
      description: Lakebase role, SPEC section 3 tables and NOTIFY trigger; Kafka topics only when backbone=kafka. Idempotent. Run before the app.
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: init
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/init.py
            base_parameters:
              project_id: ${var.project_id}
              branch_name: ${var.branch_name}
              database_name: ${var.database_name}
              pg_role: ${var.pg_role}
              secret_scope: ${var.secret_scope}
              backbone: ${var.backbone}
              kafka_security: ${var.kafka_security}
              kafka_topics: ${var.kafka_topics}
              kafka_partitions: ${var.kafka_partitions}
              kafka_replication_factor: ${var.kafka_replication_factor}
              aws_region: ${var.aws_region}

    call_sidekick_init_history:
      name: call-sidekick-init-history
      description: Creates the seven Zerobus history tables in UC and grants the ingest service principal MODIFY+SELECT. Idempotent. Run before the first app start (direct backbone).
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: init_history
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/init_history.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              zerobus_principal: ${var.zerobus_principal}

    call_sidekick_reconcile_history:
      name: call-sidekick-reconcile-history
      description: Lakebase (source of truth) -> Zerobus history Delta tables. MERGEs missing and changed rows by natural key, collapses Zerobus duplicates. Every 15 minutes, 48 h watermark. dedupe_existing and full_sync are one-off backfill switches (see README).
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: reconcile_history
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/reconcile_history.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              source_mode: pg8000
              secret_scope: ${var.secret_scope}
              lakebase_catalog: ${var.lakebase_catalog}
              lakebase_schema: public
              watermark_hours: "48"
              full_sync: "false"
              dedupe_existing: "false"
              grant_to: ${workspace.current_user.userName}

    call_sidekick_kb_index:
      name: call-sidekick-kb-index
      description: src/app/playbooks/kb markdown -> Delta chunks -> Vector Search delta-sync index. Re-run when KB content changes.
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: build_kb_index
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/build_kb_index.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              kb_dir: ${workspace.file_path}/src/app/playbooks/kb
              vs_endpoint: ${var.vs_endpoint}
              embedding_endpoint: ${var.embed_model}
              index_name: kb_chunks_index

    call_sidekick_post_call_scoring:
      name: call-sidekick-post-call-scoring
      description: Scores quiescent calls with ai_query() into gold_call_scores. Scheduled every 30 minutes. Reads the Zerobus history tables (direct backbone).
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: post_call_scoring
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/post_call_scoring.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              utterances_table: ${var.scoring_utterances_table}
              cards_table: ${var.scoring_cards_table}
              scoring_endpoint: ${var.smart_model}
              idle_minutes: "15"
              max_calls_per_run: "200"

    call_sidekick_talk_track_insights:
      name: call-sidekick-talk-track-insights
      description: Daily. Last 7 days of transcripts and cards -> ai_query -> talk_track_insights (recurring objections, responses that worked, KB gaps, coverage gaps). Feeds the admin insights page (SPEC 13).
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: talk_track_insights
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/talk_track_insights.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              scoring_endpoint: ${var.smart_model}
              days: "7"
              max_calls: "150"
              utterances_table: ${var.scoring_utterances_table}
              cards_table: ${var.scoring_cards_table}

    call_sidekick_parakeet_register:
      name: call-sidekick-parakeet-register
      description: One-off (re-run on model upgrades). Registers Parakeet to UC and creates the GPU audio serving endpoint (not route-optimized; scale-to-zero per gpu_scale_to_zero). Serverless GPU.
      max_concurrent_runs: 1
      environments:
        - environment_key: gpu
          spec:
            environment_version: "6"
      tasks:
        - task_key: register_parakeet
          environment_key: gpu
          compute:
            hardware_accelerator: ${var.gpu_accelerator}
          notebook_task:
            notebook_path: ../src/notebooks/register_parakeet.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              model_name: ${var.parakeet_model}
              endpoint_name: ${var.parakeet_endpoint}
              artifact_volume: /Volumes/${resources.volumes.sidekick_checkpoints.catalog_name}/${resources.volumes.sidekick_checkpoints.schema_name}/${resources.volumes.sidekick_checkpoints.name}
              workload_type: GPU_MEDIUM
              workload_size: Small
              gpu_scale_to_zero: ${var.gpu_scale_to_zero}

    call_sidekick_kokoro_register:
      name: call-sidekick-kokoro-register
      description: One-off (re-run on model upgrades). Registers Kokoro-82M TTS to UC and creates the GPU endpoint for voice mode (scale-to-zero per gpu_scale_to_zero, default on for dev cost). Serverless GPU.
      max_concurrent_runs: 1
      environments:
        - environment_key: gpu
          spec:
            environment_version: "6"
      tasks:
        - task_key: register_kokoro
          environment_key: gpu
          compute:
            hardware_accelerator: ${var.gpu_accelerator}
          notebook_task:
            notebook_path: ../src/notebooks/register_kokoro.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.uc_schema}
              uc_model: ${var.kokoro_model}
              endpoint_name: ${var.kokoro_endpoint}
              artifact_volume: /Volumes/${resources.volumes.sidekick_checkpoints.catalog_name}/${resources.volumes.sidekick_checkpoints.schema_name}/${resources.volumes.sidekick_checkpoints.name}
              workload_type: GPU_MEDIUM
              workload_size: Small
              gpu_scale_to_zero: ${var.gpu_scale_to_zero}
